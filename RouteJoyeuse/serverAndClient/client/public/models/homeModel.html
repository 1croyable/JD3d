<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three.js Example</title>
    <style>
        body {
            margin: 0;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // 场景设置
        const scene = new THREE.Scene();

        // 相机设置
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 100); // 将相机位置拉远

        // 渲染器设置
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 启用阴影映射
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 使用软阴影
        document.body.appendChild(renderer.domElement);

        // 光照设置
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.6);
        directionalLight.position.set(10, 60, 0); // 设置光照位置
        directionalLight.castShadow = true; // 启用阴影
        directionalLight.shadow.mapSize.width = 2048; // 增加阴影质量
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.top = 500;
        directionalLight.shadow.camera.bottom = -500;
        directionalLight.shadow.camera.left = -300;
        directionalLight.shadow.camera.right = 300;
        scene.add(directionalLight);

        // 环境光
        const ambientLight = new THREE.AmbientLight(0x404040, 1.7); // 添加一些环境光
        scene.add(ambientLight);

        // GLTFLoader 加载模型
        const loader = new THREE.GLTFLoader();
        let model;
        loader.load('./phoenix_bird.glb', function (gltf) {
            model = gltf.scene;
            model.scale.set(0.13, 0.13, 0.13); // 缩放模型
            model.position.y = -10;
            model.traverse(function (node) {
                if (node.isMesh) {
                    node.castShadow = true; // 启用模型阴影投射
                }
            });
            scene.add(model);

            // 设置模型动画
            const mixer = new THREE.AnimationMixer(model);
            const action = mixer.clipAction(gltf.animations[0]);
            action.play();
            animate.mixer = mixer; // 在animate循环中访问混合器
        }, undefined, function (error) {
            console.error(error);
        });

        // 创建接收阴影的平面
        const planeGeometry = new THREE.PlaneGeometry(500, 500);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.5 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2; // 旋转平面
        plane.position.y = -50;
        plane.receiveShadow = true; // 启用平面接收阴影
        scene.add(plane);

        // 创建一个更低的接收阴影的平面，用于模糊阴影
        const softPlaneGeometry = new THREE.PlaneGeometry(3000, 3000);
        const softPlaneMaterial = new THREE.ShadowMaterial({ opacity: 0.2 });
        const softPlane = new THREE.Mesh(softPlaneGeometry, softPlaneMaterial);
        softPlane.rotation.x = -Math.PI / 2; // 旋转平面
        softPlane.position.y = -51; // 稍微低于第一个平面
        softPlane.receiveShadow = true; // 启用平面接收阴影
        scene.add(softPlane);

        // OrbitControls 设置
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 启用阻尼效果
        controls.dampingFactor = 0.025;
        controls.enableZoom = false; // 禁用缩放
        controls.enablePan = false; // 禁用平移
        controls.minPolarAngle = Math.PI / 2;
        controls.maxPolarAngle = Math.PI / 2;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.ROTATE,
            RIGHT: THREE.MOUSE.PAN
        };

        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            if (animate.mixer) {
                animate.mixer.update(0.01); // 更新动画混合器
            }
            if (model) {
                model.rotation.y += 0.005;
            }
            controls.update(); // 更新控制
            renderer.render(scene, camera);
        }
        animate();

        // 窗口调整大小事件
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
