<style>
  body {
    width: 100vw;

    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE and Edge */
  }

  * {
    margin: 0;
    padding: 0;
  }

  /* WebKit 内核浏览器的滚动条 */
  /* 隐藏垂直滚动条 */
  ::-webkit-scrollbar {
    width: 0;
    height: 0;
  }
  
  /* 隐藏水平滚动条 */
  ::-webkit-scrollbar-track {
    display: none;
  }
  
  /* 隐藏滚动条的滑块 */
  ::-webkit-scrollbar-thumb {
    display: none;
  }
  
  /* 隐藏滚动条的边框 */
  ::-webkit-scrollbar-track-piece {
    display: none;
  }
